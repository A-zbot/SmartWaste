{% extends "base.html" %}{% block title %}Login | SmartWaste{% endblock %}
{% block content %}
<section class="login-page"><div class="login-card"><div class="login-logo">♻</div><span>SMARTWASTE</span><h1>Welcome Back</h1><p>Sign in to your account to continue.</p><form method="post"><label>Username or Email<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary full">Sign In →</button></form><small>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></small></div></section>
{% endblock %}
