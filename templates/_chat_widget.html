{% if chat_enabled %}
<div id="sw-chat"
     class="sw-chat"
     data-role="{{ 'admin' if session.get('admin') else ('citizen' if session.get('user_id') else 'guest') }}"
     data-csrf="{{ csrf_token() }}"
     data-login-href="{{ url_for('auth.login') }}"
     data-home-href="{{ url_for('public.home') }}"
     data-admin-href="{{ url_for('admin.dashboard') }}"
     data-suggestions="{{ ({
       'citizen': ['Help me segregate waste', 'Register a complaint', 'Track my complaint', 'Learn about recycling'],
       'admin': ['Show pending complaints', 'Identify high-priority areas', 'Summarize complaint statistics', 'Explain hotspot analysis'],
       'guest': ['Help me segregate waste', 'Register a complaint', 'Track my complaint', 'Learn about recycling']
     }) | tojson }}">
  <button type="button" id="sw-chat-fab" class="sw-chat-fab"
          aria-label="Open SmartWaste AI assistant" aria-expanded="false"
          aria-controls="sw-chat-panel" title="SmartWaste AI">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
         stroke-linejoin="round">
      <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3c-1.3 0-2.6-.3-3.7-.8L3 20.5l1.6-4.6A8.2 8.2 0 0 1 3.5 11.5C3.5 6.9 7.5 3.2 12.2 3.2S21 6.9 21 11.5z"/>
      <path d="M12 8.2l.9 2.1 2.2.3-1.6 1.5.4 2.2-1.9-1.1-1.9 1.1.4-2.2-1.6-1.5 2.2-.3z"/>
    </svg>
    <span class="sw-chat-fab-badge" aria-hidden="true"></span>
  </button>

  <section id="sw-chat-panel" class="sw-chat-panel" hidden
           role="dialog" aria-label="SmartWaste AI assistant">
    <header class="sw-chat-head">
      <div class="sw-chat-brand">
        <span class="sw-chat-avatar" aria-hidden="true">AI</span>
        <div class="sw-chat-brand-text">
          <strong>SmartWaste AI</strong>
          <small id="sw-chat-status">Your intelligent waste management assistant</small>
        </div>
      </div>
      <div class="sw-chat-head-actions">
        <label class="sw-chat-lang" title="Reply language">
          <span class="sr-only">Language</span>
          <select id="sw-chat-lang">
            <option value="en">EN</option>
            <option value="hi">हिन्दी</option>
            <option value="hinglish">Hinglish</option>
          </select>
        </label>
        <button type="button" class="sw-chat-icon-btn" id="sw-chat-history-btn"
                title="Chat history" aria-label="Chat history">☰</button>
        <button type="button" class="sw-chat-icon-btn" id="sw-chat-new"
                title="New conversation" aria-label="New conversation">✚</button>
        <button type="button" class="sw-chat-icon-btn sw-chat-close-btn"
                id="sw-chat-close" title="Close" aria-label="Close chat">×</button>
      </div>
    </header>

    <div class="sw-chat-history" id="sw-chat-history" hidden>
      <div class="sw-chat-history-title">Recent conversations</div>
      <ul id="sw-chat-history-list"></ul>
    </div>

    <div class="sw-chat-messages" id="sw-chat-messages" aria-live="polite"></div>

    <div class="sw-chat-suggestions" id="sw-chat-suggestions"></div>

    <div class="sw-chat-composer">
      <textarea id="sw-chat-text" rows="1" maxlength="2000"
                placeholder="Ask SmartWaste AI anything..."
                aria-label="Message"></textarea>
      <button type="button" id="sw-chat-send" class="sw-chat-send" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>
        </svg>
      </button>
    </div>
    <div class="sw-chat-foot">Powered by Google Gemini · Answers grounded in SmartWaste knowledge</div>
  </section>
</div>
{% endif %}
